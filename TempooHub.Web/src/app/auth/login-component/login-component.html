<div class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-xl shadow-2xl p-8">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-white">Bienvenido</h2>
      <p class="text-slate-400 mt-2">Introduce tus credenciales para entrar</p>
    </div>

    <form (submit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
        <input type="email" 
               [ngModel]="email()" 
               (ngModelChange)="email.set($event)" 
               name="email" 
               class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition"
               placeholder="nombre@ejemplo.com" required>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Contraseña</label>
        <input type="password" 
               [ngModel]="password()" 
               (ngModelChange)="password.set($event)" 
               name="password" 
               class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none transition"
               placeholder="••••••••" required>
      </div>

      @if (errorMessage()) {
        <div class="bg-red-900/30 border border-red-800 text-red-400 p-3 rounded-lg text-sm flex items-center">
          <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" /></svg>
          {{ errorMessage() }}
        </div>
      }

      <button type="submit" 
              [disabled]="isLoading()"
              class="w-full py-3 bg-blue-700 hover:bg-blue-600 disabled:bg-slate-800 disabled:text-slate-500 text-white font-semibold rounded-lg transition-all shadow-lg active:transform active:scale-95">
        @if (isLoading()) {
          <span class="flex items-center justify-center">
            <svg class="animate-spin h-5 w-5 mr-3 text-white" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Cargando...
          </span>
        } @else {
          Entrar
        }
      </button>
    </form>
  </div>
</div>
